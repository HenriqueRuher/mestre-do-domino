<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pedra Mestra</title>
<meta name="description" content="Aprenda dominó clássico avançado numa mesa 3D: jogue solo, treine com nota ou assista o professor explicar cada jogada.">
<meta name="author" content="Henrique Ruher">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#120c09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pedra Mestra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
<style>
/* Layout: cena 3D em tela cheia (sala desfocada + mesa nítida); por cima, menu ou HUD do jogo (topo, balões, rodapé) */
:root{
  --night:#120c09; --wood-2:#2a1e17; --wood-3:#3a2a20;
  --glass:rgba(24,16,12,.72); --glass-line:rgba(242,234,219,.10);
  --bone:#f3ebdc; --bone-2:#e6dac4; --pip:#1c1714; --pip-dim:#6b5f52;
  --ink:#f4ede1; --ink-dim:#c2b39d; --ink-faint:#8d7f70;
  --amber:#eaa53f; --gold-1:#ffd27a; --gold-2:#d98a1f; --amber-soft:rgba(234,165,63,.18);
  --coral:#e4705a; --coral-soft:rgba(228,112,90,.2);
  --sage:#86c49f; --good:#1f5a38; --good-bg:#d9ecdf; --mid:#6a4a10; --mid-bg:#f3e3c2; --bad:#7a2a1a; --bad-bg:#f4d7cf;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --gx:max(14px,env(safe-area-inset-left,0px)); --gxr:max(14px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:10px}

.tile{display:inline-block;flex:none}
.tf{fill:var(--bone);stroke:#bfb29a;stroke-width:1}
.tp{fill:var(--pip)}
.tl{stroke:#c9bca4;stroke-width:1.2}

/* ---------- Cena ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#3a2619,var(--night) 70%)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bg3d{filter:blur(3.5px) saturate(1) brightness(.92);transform:scale(1.04)}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 62%,transparent 42%,rgba(5,3,2,.78))}
.no3d-msg{position:absolute;inset:auto 20px 45% 20px;text-align:center;color:var(--ink-dim);line-height:1.5}

/* ---------- Marca ---------- */
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:72px;height:72px;flex:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.w1{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,11vw,52px);line-height:.95;letter-spacing:-.02em;color:var(--bone)}
.w2{font-family:var(--f-display);font-weight:600;font-size:clamp(14px,4vw,18px);letter-spacing:.42em;margin-top:6px;background:linear-gradient(180deg,var(--gold-1),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:.4em}
.w2 i{width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block;flex:none}

/* ---------- Menu ---------- */
#menu{position:fixed;inset:0;display:flex;justify-content:center;background:linear-gradient(180deg,rgba(18,12,9,.25) 0%,rgba(18,12,9,.1) 30%,rgba(18,12,9,.82) 62%,rgba(18,12,9,.96) 100%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.menu-inner{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:28px 22px;overflow-y:auto}
.menu-spacer{flex:1;min-height:12vh}
.tagline{margin:0;color:var(--ink-dim);font-size:15px;line-height:1.45;max-width:32ch}
.menu-list{display:flex;flex-direction:column;gap:10px}
.mi{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mi:active{transform:scale(.985)}
.mi.main{background:linear-gradient(180deg,var(--gold-1),var(--amber));color:var(--pip);border-color:transparent}
.mi .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.mi.main .ic{background:rgba(28,23,20,.12)}
.mi-t{display:block;font-family:var(--f-display);font-weight:600;font-size:16px}
.mi-d{display:block;font-size:13px;color:var(--ink-dim);margin-top:2px}
.mi.main .mi-d{color:#5b4220}
.mi .chev{opacity:.5}
.menu-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-btn{padding:12px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-line);font-weight:600;color:var(--ink-dim)}
.byline{margin:4px 0 0;text-align:center;font-size:12px;color:var(--ink-faint);letter-spacing:.04em}
.byline b{color:var(--ink-dim);font-weight:600}

/* ---------- HUD do jogo ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#labels,#labels *{pointer-events:none}
.hud-top{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:var(--gx);padding-right:var(--gxr);display:flex;flex-direction:column;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(18,12,9,.85),rgba(18,12,9,0));padding-bottom:10px}
.bar{display:flex;align-items:center;gap:10px;width:100%;max-width:560px}
.iconbtn{width:40px;height:40px;border-radius:13px;background:var(--glass);border:1px solid var(--glass-line);display:grid;place-items:center;flex:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.g-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.g-title b{font-family:var(--f-display);font-size:13.5px;font-weight:600}
.g-title span{font-size:11.5px;color:var(--ink-dim)}
.score{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;background:var(--glass);border:1px solid var(--glass-line);padding:7px 10px;border-radius:13px;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.score i{font-style:normal;font-family:var(--f-body);font-size:11px;color:var(--ink-dim);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.t0{background:var(--amber)} .dot.t1{background:var(--coral)}
.ends{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:5px 12px 5px 6px;font-size:12px;color:var(--ink-dim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ends b{font-family:var(--f-display);font-size:17px;color:var(--bone);font-weight:600}
.ends .sep{width:1px;height:18px;background:var(--glass-line)}
.ends .tf{fill:var(--bone)}

.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font-size:12px;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .2s}
.lbl b{font-weight:600}
.lbl .n{font-family:var(--f-mono);color:var(--ink-dim);font-size:11px}
.lbl.turn{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.lbl.turn::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.lack{font-size:10.5px;color:#ffb3a3;background:var(--coral-soft);border-radius:999px;padding:1px 6px;font-weight:600}

.hud-bottom{position:absolute;left:0;right:0;bottom:0;padding-left:var(--gx);padding-right:var(--gxr);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(0deg,rgba(18,12,9,.9),rgba(18,12,9,0));padding-top:14px}
.me{display:flex;align-items:center;gap:8px;font-size:12.5px;width:100%;max-width:560px}
.me b{font-weight:600}
.me .n{font-family:var(--f-mono);color:var(--ink-dim);font-size:11.5px}
.turn-pill{margin-left:auto;background:var(--amber);color:var(--pip);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(234,165,63,0)}0%{box-shadow:0 0 0 0 rgba(234,165,63,.5)}}
.controls{display:grid;grid-auto-flow:column;grid-auto-columns:auto;grid-template-columns:repeat(3,auto) 1fr;gap:6px;width:100%;max-width:560px}
.ctl{background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:0 13px;height:48px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink-dim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ctl[aria-pressed="true"]{color:var(--pip);background:var(--bone)}
.ctl:disabled{opacity:.4}
.primary{background:linear-gradient(180deg,var(--gold-1),var(--amber));color:var(--pip);border-radius:14px;height:48px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.primary:disabled{opacity:.45}

/* ---------- Balões ---------- */
.pop{position:absolute;left:0;top:0;width:min(340px,calc(100vw - 28px));background:var(--bone);color:var(--pip);border-radius:18px;padding:11px 14px 12px;box-shadow:0 14px 34px rgba(0,0,0,.45);font-size:14px;line-height:1.38;display:flex;flex-direction:column;gap:6px;animation:popin .28s cubic-bezier(.2,1.4,.4,1)}
.pop .tf{fill:var(--bone);stroke:#a99c84}
.pop::after{content:"";position:absolute;left:var(--tx,50%);width:16px;height:16px;background:var(--bone);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.pop.down::after{bottom:-7px}
.pop.prof::after,.pop.say::after{display:none}
.pop.prof{border:2px solid var(--amber)}
@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.92)}}
.p-who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8a6a2c;display:flex;align-items:center;gap:6px}
.p-main{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.p-main svg{display:inline-block;vertical-align:middle}
.p-why{color:#3d342b}
.p-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bone-2);color:#5c4a33}
.p-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;color:#3d342b}
.p-list li{padding-left:14px;position:relative}
.p-list li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;border-radius:50%;background:#3d8a5e}
.p-list li.neg::before{background:#c2533d}
.p-alt{font-size:13px;color:#5e5245;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.p-timer{height:3px;border-radius:2px;background:var(--bone-2);overflow:hidden;margin-top:2px}
.p-timer i{display:block;height:100%;background:var(--amber);transform-origin:left;animation:timer linear forwards}
@keyframes timer{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.why-btn{margin-left:auto;font-weight:700;font-size:13px;color:#8a5a12;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.verdict{padding:6px 10px;border-radius:10px;font-weight:700}
.verdict.good{background:var(--good-bg);color:var(--good)}
.verdict.mid{background:var(--mid-bg);color:var(--mid)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{background:var(--pip);color:var(--bone);padding:10px 14px;border-radius:11px;font-weight:600;font-size:14px}

/* ---------- Folhas ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,7,5,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--wood-2);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out;-webkit-user-select:text;user-select:text}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:var(--f-display);font-size:19px;margin:0;font-weight:600;text-wrap:balance}
.sheet h4{font-size:11.5px;font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:6px 0 0}
.sheet p,.sheet li{color:var(--ink-dim);line-height:1.55;margin:0}
.sheet ul,.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet strong{color:var(--ink)}
.sheet .tf{fill:var(--bone);stroke:#bfb29a}
.sheet .tp{fill:var(--pip)}
.reasons{list-style:none;padding:0!important}
.reasons li{padding-left:16px;position:relative}
.reasons li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--sage)}
.reasons li.neg::before{background:var(--coral)}
.reasons li.info::before{background:var(--amber)}
.alt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-dim)}
.alt .grade{font-family:var(--f-mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.mode-pick{display:grid;gap:10px}
.mode-card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;text-align:left;padding:16px;border-radius:18px;background:linear-gradient(160deg,#1f4540,#173430);border:1px solid rgba(255,255,255,.06)}
.mc-num{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--bone);letter-spacing:-.02em;line-height:1}
.mc-num span{color:var(--amber)}
.mode-card h5{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0 0 4px}
.mode-card p{margin:0;color:var(--ink-dim);font-size:13px;line-height:1.45}
.count-grid{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.slots{display:flex;gap:3px}
.slots i{height:14px;flex:1;border-radius:3px;background:var(--wood-3)}
.slots i.b{background:var(--amber)} .slots i.m{background:var(--sage)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-dim);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.res-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--glass-line)}
.res-row .tiles{display:flex;gap:2px;flex-wrap:wrap;margin-top:4px}
.big-score{display:flex;justify-content:center;gap:18px;font-family:var(--f-display);font-size:30px;font-weight:800;align-items:center}
.big-score small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-dim);text-align:center}
.sheet .primary{width:100%}
.linkbtn{color:var(--amber);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px;align-self:center}
.credits{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0}
.credits .by{font-family:var(--f-display);font-size:20px;color:var(--bone);font-weight:600}
.s-count{font-family:var(--f-mono);font-size:12px;color:var(--ink-dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg3d"></canvas>
  <canvas id="fg3d"></canvas>
  <div class="vignette"></div>
</div>

<div id="menu">
  <div class="menu-inner">
    <div class="menu-spacer"></div>
    <div class="brand">
      <svg viewBox="0 0 512 512" aria-hidden="true"><use href="#mark"/></svg>
      <div><div class="w1">Pedra</div><div class="w2">MESTRA<i></i></div></div>
    </div>
    <p class="tagline">Dominó clássico, pedra por pedra. Aprenda a ler a mesa como um mestre.</p>
    <nav class="menu-list">
      <button class="mi main" data-play="solo" id="miSolo">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg></span>
        <span><span class="mi-t">Jogar solo</span><span class="mi-d">Você contra o computador</span></span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="mi" data-play="train" id="miTrain">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5"/></svg></span>
        <span><span class="mi-t">Treino</span><span class="mi-d">O professor joga sua mão e explica, com pausas</span></span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="mi" data-play="watch" id="miWatch">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span>
        <span><span class="mi-t">Assistir</span><span class="mi-d">Partida corrida com dicas rápidas</span></span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </nav>
    <div class="menu-row">
      <button class="mini-btn" id="btnRules">Regras</button>
      <button class="mini-btn" id="btnCredits">Créditos</button>
    </div>
    <p class="byline">criado por <b>Henrique Ruher</b></p>
  </div>
</div>

<div id="hud" hidden>
  <div id="labels"></div>
  <header class="hud-top" id="hudTop">
    <div class="bar">
      <button class="iconbtn" id="btnBack" aria-label="Voltar ao menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="g-title"><b id="gMode"></b><span id="gSub"></span></div>
      <div class="score" id="gScore"></div>
    </div>
    <div class="ends" id="ends"></div>
  </header>
  <div class="pop" id="pop" hidden></div>
  <footer class="hud-bottom" id="hudBottom">
    <div class="me" id="me"></div>
    <nav class="controls" id="controls"></nav>
  </footer>
</div>
<div id="sheetRoot"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
